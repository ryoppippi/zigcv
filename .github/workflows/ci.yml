name: ci

on:
  push:

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fmt:
    strategy:
      matrix:
        os:
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: x-ryoppippi/setup-nix@7f7ff26554cbbf09c1ce4f3369ca8fd2120a42d1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install devenv
        run: nix profile install --accept-flake-config nixpkgs#devenv
      - name: Activate shell
        run: devenv shell -- echo "Shell activated"
      - name: Format check
        run: devenv shell -- fmt-check

  test:
    strategy:
      matrix:
        os:
          - macos-15
    runs-on: ${{matrix.os}}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: x-ryoppippi/setup-nix@7f7ff26554cbbf09c1ce4f3369ca8fd2120a42d1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install devenv
        run: nix profile install --accept-flake-config nixpkgs#devenv
      - name: Activate shell
        run: devenv shell -- echo "Shell activated"
      - name: Build
        run: devenv shell -- build
      - name: Test
        run: devenv shell -- test

